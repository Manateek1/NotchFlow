name: NotchFlow
options:
  bundleIdPrefix: com.dillonnagar
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  NotchFlow:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NotchFlow
        excludes:
          - "Resources/Info.plist"
          - "Resources/NotchFlow.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dillonnagar.NotchFlow
        PRODUCT_NAME: NotchFlow
        INFOPLIST_FILE: NotchFlow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchFlow/Resources/NotchFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: EventKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: IOKit.framework
      - sdk: IOBluetooth.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: Combine.framework
  NotchFlowTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NotchFlow
        excludes:
          - "App/NotchFlowApp.swift"
          - "Resources/Info.plist"
          - "Resources/NotchFlow.entitlements"
      - path: NotchFlowTests
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: EventKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: IOKit.framework
      - sdk: IOBluetooth.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: Combine.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dillonnagar.NotchFlowTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchFlow:
    build:
      targets:
        NotchFlow: all
        NotchFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchFlowTests
    archive:
      config: Release
