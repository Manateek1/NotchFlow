name: NotchFlow macOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build NotchFlow (Release)
        run: |
          xcodebuild -project NotchFlow.xcodeproj \
            -scheme NotchFlow \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Automated Unit Tests
        run: |
          xcodebuild -project NotchFlow.xcodeproj \
            -scheme NotchFlow \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
